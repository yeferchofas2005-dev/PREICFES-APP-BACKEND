# ==================================================
# PREICFES GRATUITO — BACKEND
# Configuracion de Spring Boot. Para produccion, use
# variables de entorno en lugar de valores sensibles.
# ==================================================

spring.application.name=PreicfesGratuitoBackend

# ==================================================
# CONFIGURACION SERVIDOR
# ==================================================

server.port=8080

# ==================================================
# BASE DE DATOS MYSQL
# ==================================================

spring.datasource.url=jdbc:mysql://localhost:3306/db_preicfes_gratuito?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================================================
# JPA / HIBERNATE
# ==================================================

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==================================================
# LOGGING SQL
# ==================================================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==================================================
# ACTUATOR
# ==================================================

management.endpoints.web.exposure.include=health,info,metrics

# ==================================================
# JWT
# ==================================================

jwt.secret=preicfes-gratuito-jwt-secret-key-change-this-value-in-production-2026
jwt.expiration-ms=86400000

# ==================================================
# REGISTRO PUBLICO
# ==================================================

app.auth.self-register-enabled=false

# ==================================================
# ENCODING
# ==================================================

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
