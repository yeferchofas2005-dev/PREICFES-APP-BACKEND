# ==================================================
# PREICFES GRATUITO — BACKEND
# Configuracion de Spring Boot. Para produccion, use
# variables de entorno en lugar de valores sensibles.
# ==================================================

spring.application.name=PreicfesGratuitoBackend
spring.config.import=optional:file:.env[.properties]

# ==================================================
# CONFIGURACION SERVIDOR
# ==================================================

server.port=8080

# ==================================================
# BASE DE DATOS MYSQL
# ==================================================

spring.datasource.url=jdbc:mysql://localhost:3306/db_preicfes_gratuito?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================================================
# JPA / HIBERNATE
# ==================================================

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==================================================
# LOGGING SQL
# ==================================================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==================================================
# ACTUATOR
# ==================================================

management.endpoints.web.exposure.include=health,info,metrics

# ==================================================
# JWT
# ==================================================

jwt.secret=preicfes-gratuito-jwt-secret-key-change-this-value-in-production-2026
jwt.expiration-ms=86400000

# ==================================================
# REGISTRO PUBLICO Y CARGA DE ARCHIVOS
# ==================================================

app.auth.self-register-enabled=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ==================================================
# CORREO SMTP (GMAIL) Y COLA DE CREDENCIALES
# ==================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.max-per-day=${MAX_CORREOS_POR_DIA:450}
app.mail.platform-url=${URL_PLATAFORMA:http://localhost:4200}
app.mail.sender-name=${CORREO_REMITENTE_NOMBRE:RumboALaU - PreICFES Gratuito}
app.mail.delay-between-emails-ms=${MAIL_DELAY_MS:1000}
app.mail.daily-cron=${MAIL_DAILY_CRON:0 0 8 * * *}
app.crypto.aes-key=${CREDENTIAL_AES_KEY:rumbo-a-la-u-clave-aes-local-2026}

# ==================================================
# ENCODING
# ==================================================

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
